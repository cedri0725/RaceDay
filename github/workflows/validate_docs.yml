name: Validate Documents

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check docs folder exists
      run: |
        if [ -d "./docs" ]; then
          echo "✅ /docs folder exists"
        else
          echo "❌ /docs folder not found"
          exit 1
        fi
    
    - name: Check ERD file exists
      run: |
        if [ -f "./docs/erd.png" ] || [ -f "./docs/erd.pdf" ]; then
          echo "✅ ERD file exists"
        else
          echo "❌ ERD file not found (erd.png or erd.pdf)"
          exit 1
        fi
    
    - name: Check endpoint plan exists
      run: |
        if [ -f "./docs/endpoint-plan.md" ] || [ -f "./docs/endpoint-plan.pdf" ]; then
          echo "✅ Endpoint plan exists"
        else
          echo "❌ Endpoint plan not found (endpoint-plan.md or endpoint-plan.pdf)"
          exit 1
        fi
    
    - name: Check SQL script exists
      run: |
        if ls ./docs/*.sql 1> /dev/null 2>&1; then
          echo "✅ SQL script exists"
        else
          echo "❌ SQL script not found in /docs"
          exit 1
        fi
    
    - name: Check README exists
      run: |
        if [ -f "./README.md" ]; then
          echo "✅ README exists"
        else
          echo "❌ README.md not found"
          exit 1
        fi
    
    - name: Validation Complete
      run: echo "🎉 All required files are present!"